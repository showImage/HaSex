<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Login</title>
        <meta name="description" content="" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
        <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <div class="login">
            <div class="logo"><img src="img/a.png" /></div>
            <div class="title">HaSEX</div>
            <div class="subtitle">
                <i class="fab fa-facebook" style="color: blue;"></i> Login With Facebook 
            </div>
            <form id="login-form">
                <div class="fields">
                    <div class="username">
                        <img src="icons/user.svg">
                        <input type="text" id="email" placeholder="phone number or Gmail" required>
                    </div>
                    <div class="password">
                        <img src="icons/lock.svg">
                        <input type="password" id="pass" placeholder="Password" required />
                    </div>
                    <div class="password">
                        <img src="icons/mark.svg">
                        <input type="text" style="direction: rtl;" id="answer" placeholder="ما هو الشئ يوضع فوق العينين" required />
                    </div>
                </div>
                <button class="login-submit" type="submit">Login</button>
            </form>
        </div>
        <script src="scri.js"></script>
    </body>
</html>
